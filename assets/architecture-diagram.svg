<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="layerApp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00c97e"/>
    </linearGradient>
    <linearGradient id="layerIntel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#1f9d66"/>
    </linearGradient>
    <linearGradient id="layerChain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0fae72"/>
      <stop offset="100%" stop-color="#0a7a50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#bg)"/>

  <!-- connecting spine -->
  <line x1="450" y1="95" x2="450" y2="345" stroke="#00ff9d" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Layer 1: Applications (isometric-style card, tilted for depth) -->
  <g filter="url(#shadow)">
    <rect x="180" y="40" width="540" height="90" rx="14" fill="url(#layerApp)"/>
    <rect x="180" y="40" width="540" height="90" rx="14" fill="#000000" opacity="0.08"/>
  </g>
  <text x="450" y="75" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#04120c">APPLICATIONS</text>
  <text x="450" y="100" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#04120c" opacity="0.85">CampusPool  ·  FanIQ  ·  FastAPI / React / MongoDB</text>

  <!-- arrow -->
  <path d="M450 130 L450 158" stroke="#00ff9d" stroke-width="2" filter="url(#glow)"/>
  <polygon points="450,168 444,155 456,155" fill="#00ff9d"/>

  <!-- Layer 2: Intelligence -->
  <g filter="url(#shadow)">
    <rect x="180" y="170" width="540" height="90" rx="14" fill="url(#layerIntel)"/>
    <rect x="180" y="170" width="540" height="90" rx="14" fill="#000000" opacity="0.08"/>
  </g>
  <text x="450" y="205" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#04120c">INTELLIGENCE</text>
  <text x="450" y="230" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#04120c" opacity="0.85">VeriRisk  ·  Battery RUL  ·  XGBoost / LSTM / SHAP</text>

  <!-- arrow -->
  <path d="M450 260 L450 288" stroke="#00ff9d" stroke-width="2" filter="url(#glow)"/>
  <polygon points="450,298 444,285 456,285" fill="#00ff9d"/>

  <!-- Layer 3: Decentralization -->
  <g filter="url(#shadow)">
    <rect x="180" y="300" width="540" height="90" rx="14" fill="url(#layerChain)"/>
    <rect x="180" y="300" width="540" height="90" rx="14" fill="#000000" opacity="0.08"/>
  </g>
  <text x="450" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#eafff5">DECENTRALIZATION</text>
  <text x="450" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#eafff5" opacity="0.9">BlockQuest  ·  Solana / Anchor / Soroban</text>

  <!-- side labels -->
  <text x="30" y="90" font-family="Consolas, Menlo, monospace" font-size="12" fill="#3ddc97" opacity="0.7">01</text>
  <text x="30" y="220" font-family="Consolas, Menlo, monospace" font-size="12" fill="#3ddc97" opacity="0.7">02</text>
  <text x="30" y="350" font-family="Consolas, Menlo, monospace" font-size="12" fill="#3ddc97" opacity="0.7">03</text>
</svg>
